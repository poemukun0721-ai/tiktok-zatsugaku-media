<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>動画で紹介した商品</title>
<style>
  :root { --bg:#faf7f2; --card:#fff; --ink:#2a2622; --sub:#7a716a; --accent:#bf0000; --line:#ece6de; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1917; --card:#26231f; --ink:#f1ece6; --sub:#a9a097; --line:#3a352f; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; line-height:1.6; }
  main { max-width:560px; margin:0 auto; padding:28px 16px 48px; }
  h1 { font-size:1.35rem; margin:0 0 6px; }
  .pr { display:inline-block; background:var(--accent); color:#fff; font-weight:700; font-size:.8rem; padding:2px 10px; border-radius:999px; margin-bottom:10px; }
  .note { color:var(--sub); font-size:.85rem; margin:0 0 22px; }
  ul { list-style:none; padding:0; margin:0; display:grid; gap:12px; }
  li a { display:block; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; color:inherit; text-decoration:none; }
  li a:active { transform:scale(.99); }
  .date { color:var(--sub); font-size:.78rem; }
  .name { font-weight:700; margin:2px 0 4px; }
  .go { color:var(--accent); font-size:.85rem; font-weight:700; }
  footer { color:var(--sub); font-size:.75rem; margin-top:28px; }
</style>
</head>
<body>
<main>
  <span class="pr">#PR</span>
  <h1>動画で紹介した商品</h1>
  <p class="note">このページには楽天アフィリエイトのリンクが含まれます。価格・在庫は変わるので、リンク先の商品ページでご確認ください。新しい動画の商品が上に追加されます。</p>
  <ul>
<!-- ITEMS START -->
<!-- ITEMS END -->
  </ul>
  <footer>※動画のナレーションは合成音声です。</footer>
</main>
</body>
</html>
